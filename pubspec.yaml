name: rp_silver_house
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.1+3

environment:
  sdk: ^3.12.2

dependencies:
  flame: ^1.37.0
  flutter:
    sdk: flutter
  go_router: ^18.0.1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/images/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
     
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf

